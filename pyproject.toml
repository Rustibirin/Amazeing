[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "A-Maze-ing maze generator module"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
requires-python = ">=3.10"
authors = [
    {name = "jruiz-ag"},
    {name = "rumartin"}
]
dependencies = [
    "pydantic>=2.0.0"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
]

[tool.setuptools]
py-modules = [
    "builder",
    "parser",
    "exporter",
    "play_mode",
    "generator",
    "maze",
    "solver",
    "templates",
    "visualizer",
]